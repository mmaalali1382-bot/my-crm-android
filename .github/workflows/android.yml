
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install matching Android platform
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
          npm install "@capacitor/android@$CAP_VERSION" --save

      - name: Build web app
        run: npm run build

      - name: Add Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/crm-release-key.jks
          test -s android/app/crm-release-key.jks

      - name: Configure permanent signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("crm-release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "crmkey"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {" + signing, 1)

          debug = """
                  debug {
                      signingConfig signingConfigs.release
                  }
          """

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace("buildTypes {", "buildTypes {" + debug, 1)

          p.write_text(s)
          PY

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: crm-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
